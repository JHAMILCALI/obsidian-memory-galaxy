<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Astra Memory Galaxy · Vista previa</title>
    <link rel="stylesheet" href="./styles.css">
    <style>
      * { box-sizing: border-box; }
      :root { --font-interface: "Segoe UI", system-ui, sans-serif; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      #galaxy { position: absolute; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      svg.icon { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </head>
  <body class="astra-view">
    <!-- Same markup and classes as AstraGalaxyView in src/main.ts, so this page previews the plugin as it looks in Obsidian. -->
    <div class="astra-stage">
      <div id="galaxy"></div>
      <header class="astra-top">
        <div class="astra-brand">
          <div class="astra-eyebrow">Astra · Atlas de memoria</div>
          <h1 class="astra-title">Memory <em>Galaxy</em></h1>
          <p class="astra-subtitle">Elige una estrella para explorar sus ideas.</p>
        </div>
        <div class="astra-stats">
          <div class="astra-stat"><strong id="stat-notes" class="astra-stat-value">0</strong><span class="astra-stat-label">notas</span></div>
          <div class="astra-stat"><strong id="stat-links" class="astra-stat-value">0</strong><span class="astra-stat-label">enlaces</span></div>
          <div class="astra-stat astra-stat-recent"><strong id="stat-recent" class="astra-stat-value">0</strong><span class="astra-stat-label">recientes</span></div>
        </div>
      </header>
      <div class="astra-tools">
        <button id="wide" class="astra-button astra-button-primary" type="button"><span class="astra-button-icon"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><path d="M10.4 21.9a10 10 0 0 0 9.941-15.416"/><path d="M13.5 2.1a10 10 0 0 0-9.841 15.416"/></svg></span><span>Galaxia completa</span></button>
        <button id="recenter" class="astra-button" type="button"><span class="astra-button-icon"><svg class="icon" viewBox="0 0 24 24"><line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg></span><span>Recentrar</span></button>
        <div class="astra-search-wrap"><span class="astra-search-icon"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span><input class="astra-search" type="search" placeholder="Buscar una nota…" aria-label="Buscar notas en la galaxia" autocomplete="off"></div>
        <button class="astra-button astra-button-settings" type="button" aria-expanded="false"><span class="astra-button-icon"><svg class="icon" viewBox="0 0 24 24"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg></span><span>Ajustes</span></button>
      </div>
      <div class="astra-legend">
        <div class="astra-legend-title">Leyenda</div>
        <div class="astra-legend-chip"><span class="astra-legend-mark is-dot"></span><span>Nota, en el color de su carpeta</span></div>
        <div class="astra-legend-chip"><span class="astra-legend-mark is-diamond"></span><span>Editada hace poco</span></div>
        <div class="astra-legend-chip"><span class="astra-legend-mark is-line"></span><span>Notas enlazadas</span></div>
      </div>
      <aside id="details" class="astra-details" hidden></aside>
      <div class="astra-controls">
        <button id="zoom-in" class="astra-icon-button" type="button" aria-label="Acercar"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
        <button id="zoom-out" class="astra-icon-button" type="button" aria-label="Alejar"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <button id="recenter-icon" class="astra-icon-button" type="button" aria-label="Recentrar"><svg class="icon" viewBox="0 0 24 24"><line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="astra-icon-button" type="button" aria-label="Pausar movimiento"><svg class="icon" viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg></button>
      </div>
      <div class="astra-hint">Clic en una estrella para ver su rama, doble clic para abrir la nota</div>
    </div>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
